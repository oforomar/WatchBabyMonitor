name: Build APKs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Download YAMNet model
        run: |
          mkdir -p watch/src/main/assets
          curl -fsSL -o watch/src/main/assets/yamnet.tflite \
            https://storage.googleapis.com/mediapipe-models/audio_classifier/yamnet/float32/1/yamnet.tflite
          ls -l watch/src/main/assets

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :watch:assembleDebug :phone:assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p out
          cp watch/build/outputs/apk/debug/watch-debug.apk out/BabyMonitor-watch.apk
          cp phone/build/outputs/apk/debug/phone-debug.apk out/BabyMonitor-phone.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/*.apk

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: Debug build of ${{ github.sha }}. Install the phone APK on the phone and the watch APK on the watch (see README).
          files: out/*.apk
